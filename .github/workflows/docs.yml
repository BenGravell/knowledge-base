name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - run: ./dev install
      - run: ./dev run python -m knowledge_base.scripts.audit_metadata --check identity --metadata-only
      - run: ./dev run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: knowledge_base/site
      - uses: actions/deploy-pages@v4
        id: deployment
