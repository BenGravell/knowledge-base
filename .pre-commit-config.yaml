repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: pyrefly
        name: pyrefly
        entry: pyrefly check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: unit-tests
        name: unit tests (60s max)
        entry: timeout 60s ./dev run kb test
        language: system
        pass_filenames: false
        always_run: true
