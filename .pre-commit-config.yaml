repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c './dev run --frozen ruff check --fix "$@" && git add -- "$@"' --
        language: system
        require_serial: true
        types_or: [python, pyi]
      - id: black
        name: black
        entry: bash -c './dev run --frozen black "$@" && git add -- "$@"' --
        language: system
        require_serial: true
        types_or: [python, pyi]
      - id: pymarkdown
        name: pymarkdown
        entry: ./dev run --frozen pymarkdown scan
        language: system
        files: ^README\.md$|^docs/.*\.md$|^knowledge_base/components/tree/README\.md$
        types: [markdown]
      - id: pyrefly
        name: pyrefly
        entry: ./dev run --frozen pyrefly check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: unit-tests
        name: unit tests for Python changes (10s max)
        entry: timeout 10s ./dev run --frozen kb test
        language: system
        pass_filenames: false
        types_or: [python, pyi]
