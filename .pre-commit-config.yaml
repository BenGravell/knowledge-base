repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c './dev run --frozen ruff check --fix "$@" && git add -- "$@"' --
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: bash -c './dev run --frozen ruff format "$@" && git add -- "$@"' --
        language: system
        types_or: [python, pyi]
      - id: pyrefly
        name: pyrefly
        entry: ./dev run --frozen pyrefly check
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: unit-tests
        name: unit tests for Python changes (10s max)
        entry: timeout 10s ./dev run --frozen kb test
        language: system
        pass_filenames: false
        types_or: [python, pyi]
