[project]
name = "knowledge-base"
version = "0.0.0"
description = "Distilled knowledge on a variety of topics"
authors = [{ name = "Benjamin Gravell", email = "bjgravell@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "zensical>=0.0.45,<0.1.0",
    "streamlit[pdf]>=1.56.0,<2.0.0",
    "plotly>=6.6.0,<7.0.0",
    "numpy>=2.4.4,<3.0.0",
    "scikit-learn>=1.8.0,<2.0.0",
    "fastembed>=0.8.0,<0.9.0",
    "umap-learn>=0.5.12,<0.6.0",
    "pydantic>=2.13.4,<3.0.0",
    "rich>=15.0.0,<16.0.0",
]

[project.scripts]
kb = "knowledge_base.dev_cli:main"
prefill = "knowledge_base.utils.prefill_template:main"

[dependency-groups]
dev = [
    "pyrefly>=1.0.0,<2.0.0",
    "ruff>=0.15.17,<0.16.0",
    "pre-commit>=4.6.0,<5.0.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
knowledge-base = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
serve = { cmd = "kb serve", description = "Serve the site locally" }
build = { cmd = "kb build", description = "Build the static site" }
refresh = { cmd = "kb refresh", description = "Refresh generated local data" }
test = { cmd = "kb test", description = "Run unit tests" }
lint = { cmd = "kb lint", description = "Run Ruff lint checks" }
format-check = { cmd = "kb format-check", description = "Check Ruff formatting" }
typecheck = { cmd = "kb typecheck", description = "Run Pyrefly type checks" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PIE",
    "PERF",
    "RUF",
    "NPY",
    "PL",
]
ignore = [
    # Long embedded JS/help text is not made clearer by Python line wrapping.
    "E501",
    # Script and data-shaping code in this repo intentionally has long,
    # branching command handlers.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLW2901",
    # User-facing CLIs, scraping helpers, and optional dependency probes catch
    # broad failures at process boundaries.
    "BLE001",
    "PLC0415",
    # The corpus intentionally normalizes and detects non-ASCII punctuation.
    "RUF001",
    "RUF002",
]

[tool.pyrefly]
preset = "strict"
project-includes = ["knowledge_base", "tests"]
search-path = ["."]
python-version = "3.12"

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_base"]
