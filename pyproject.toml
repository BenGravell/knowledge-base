[project]
name = "knowledge-base"
version = "0.0.0"
description = "Distilled knowledge on a variety of topics"
authors = [{ name = "Benjamin Gravell", email = "bjgravell@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mkdocs-material>=9.7.0,<10.0.0",
    "mkdocs-macros-plugin>=1.5.0,<2.0.0",
    "mkdocs-gen-files>=0.5.0,<0.6.0",
    "streamlit[pdf]>=1.56.0,<2.0.0",
    "plotly>=6.6.0,<7.0.0",
    "numpy>=2.4.4,<3.0.0",
    "scikit-learn>=1.8.0,<2.0.0",
    "fastembed>=0.8.0,<0.9.0",
    "umap-learn>=0.5.12,<0.6.0",
    "pydantic>=2.13.4,<3.0.0",
    "rich>=15.0.0,<16.0.0",
]

[project.entry-points."mkdocs.plugins"]
tree-nav = "knowledge_base.tree.nav_plugin:TreeNavPlugin"

[project.scripts]
prefill = "knowledge_base.utils.prefill_template:main"

[dependency-groups]
dev = [
    "pyrefly>=1.0.0,<2.0.0",
    "ruff>=0.15.17,<0.16.0",
    "pre-commit>=4.6.0,<5.0.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
knowledge-base = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
serve = "mkdocs serve -f knowledge_base/mkdocs.yml"
build = "mkdocs build -f knowledge_base/mkdocs.yml"
deploy = "mkdocs gh-deploy -f knowledge_base/mkdocs.yml"
refresh = "python knowledge_base/scripts/refresh_offline_data.py"
test = "python -m unittest discover -s tests -p test_*.py"
lint = "ruff check knowledge_base tests"
format-check = "ruff format --check knowledge_base tests"
typecheck = "pyrefly check"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "BLE",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PIE",
    "PERF",
    "RUF",
    "NPY",
    "PL",
]
ignore = [
    # Several standalone scripts prepend the repo root to sys.path before
    # importing local modules, so those imports intentionally sit below setup.
    "E402",
    # Long embedded JS/help text is not made clearer by Python line wrapping.
    "E501",
    # Script and data-shaping code in this repo intentionally has long,
    # branching command handlers.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLW2901",
    # User-facing CLIs, scraping helpers, and optional dependency probes catch
    # broad failures at process boundaries.
    "BLE001",
    "PLC0415",
    # The corpus intentionally normalizes and detects non-ASCII punctuation.
    "RUF001",
    "RUF002",
]

[tool.pyrefly]
preset = "strict"
project-includes = ["knowledge_base", "tests"]
search-path = [".", "knowledge_base/scripts"]
python-version = "3.11"

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_base"]
