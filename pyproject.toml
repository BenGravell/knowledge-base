[tool.poetry]
name = "knowledge-base"
version = "0.0.0"
description = "Distilled knowledge on a variety of topics"
authors = ["Benjamin Gravell <bjgravell@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "knowledge_base" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
mkdocs-material = "^9.7.0"
mkdocs-macros-plugin = "^1.5.0"
mkdocs-gen-files = "^0.5.0"
streamlit = {extras = ["pdf"], version = "^1.56.0"}
plotly = "^6.6.0"
matplotlib = "^3.10.8"
numpy = "^2.4.4"
scikit-learn = "^1.8.0"
fastembed = "^0.8.0"
marimo = "^0.23.2"
umap-learn = "^0.5.12"
pydantic = "^2.13.4"

[tool.poetry.group.dev.dependencies]
pyrefly = "^1.0.0"
ruff = "^0.15.17"
pre-commit = "^4.6.0"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Several standalone scripts prepend the repo root to sys.path before
    # importing local modules, so those imports intentionally sit below setup.
    "E402",
]

[tool.pyrefly]
preset = "basic"
project-includes = ["knowledge_base", "tests"]
search-path = [".", "knowledge_base/scripts"]
python-version = "3.11"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."mkdocs.plugins"]
tree-nav = "knowledge_base.tree.nav_plugin:TreeNavPlugin"
