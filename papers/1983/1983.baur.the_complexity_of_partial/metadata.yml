abstract: >
  Let L denote the nonscalar complexity in k(x_1,...,x_n). We prove L(f, df/dx_1, ..., df/dx_n) <= 3L(f). Using this we determine the complexity of single power sums, single elementary symmetric functions, the resultant and the discriminant as root functions, up to order of magnitude. Also we linearly reduce matrix inversion to computing the determinant.
summary: >
  Baur and Strassen prove that all first partial derivatives of a rational function can be computed with only a constant-factor overhead over computing the function itself, in the algebraic circuit model. The theorem is a foundational bridge between symbolic differentiation, arithmetic-circuit complexity, and the later cost model of reverse-mode automatic differentiation.
