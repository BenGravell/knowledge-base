title: >
  Similarity Search in High Dimensions via Hashing
algorithm: Locality-Sensitive Hashing
authors:
  - Aristides Gionis
  - Piotr Indyk
  - Rajeev Motwani
year: 1999
source: International Conference on Very Large Data Bases
type: Conference Paper
doi: 10.5555/645925.671516
