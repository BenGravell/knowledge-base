title: >
  Motions in Microseconds via Vectorized Sampling-Based Planning
algorithm: VAMP
authors:
  - Wil Thomason
  - Zachary Kingston
  - Lydia E. Kavraki
year: 2023
source: IEEE International Conference on Robotics and Automation (ICRA)
type: Conference Paper
doi: 10.1109/icra57147.2024.10611190
arxiv_id: "2309.14545"
tags:
  - Motion planning
