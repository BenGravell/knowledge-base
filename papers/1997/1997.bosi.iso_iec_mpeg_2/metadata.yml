abstract: >
  The ISO/IEC MPEG-2 advanced audio coding (AAC) system was designed to provide MPEG-2 with the best audio quality without any restrictions due to compatibility requirements. The main features of the AAC system (ISO/IEC 13818-7) are described. MPEG-2 AAC combines the coding efficiency of a high-resolution filter bank, prediction techniques, and Huffmann coding with additional functionalities aimed to deliver very high audio quality at a variety of data rates.
summary: >
  Documents the MPEG-2 AAC system, which relaxed MPEG-1 backward-compatibility constraints to achieve better coding efficiency and audio quality. It marks the standardization of a codec family whose filter-bank, prediction, entropy-coding, and perceptual-design choices became central to modern music and streaming audio formats.
