title: >
  In Defense of the Eight-Point Algorithm
algorithm: Normalized Eight-Point Algorithm
authors:
  - Richard I. Hartley
year: 1997
source: IEEE Transactions on Pattern Analysis and Machine Intelligence
type: Journal Paper
