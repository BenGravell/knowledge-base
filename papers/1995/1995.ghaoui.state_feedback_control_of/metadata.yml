title: >
  State-feedback Control of Systems with Multiplicative Noise via Linear Matrix Inequalities
algorithm: LMI State Feedback for Multiplicative Noise
authors:
  - Laurent El Ghaoui
year: 1995
source: Systems and Control Letters
type: Journal Paper
doi: 10.1016/0167-6911(94)00045-w
