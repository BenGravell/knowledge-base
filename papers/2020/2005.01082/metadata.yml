title: >
  Low-Complexity Learning of Linear Quadratic Regulators from Noisy Data
algorithm: "Low-Complexity Data-Driven LQR"
authors:
  - Claudio De Persis
  - Pietro Tesi
year: 2020
source: "Automatica"
type: Journal Paper
doi: 10.1016/j.automatica.2021.109548
arxiv_id: "2005.01082"
tags:
  - Data-driven control
