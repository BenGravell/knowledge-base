abstract: >
  In this paper we provide faster algorithms for solving the geometric median problem: given n points in R^(d) compute a point that minimizes the sum of Euclidean distances to the points. This is one of the oldest non-trivial problems in computational geometry yet despite an abundance of research the previous fastest algorithms for computing a (1+epsilon)-approximate geometric median were O(d* n^(4/3)epsilon^(-8/3)) by Chin et. al, tildeO(dexp{epsilon^(-4)logepsilon^(-1)}) by Badoiu et. al, O(nd+poly(d, epsilon^(-1)) by Feldman and Langberg, and O((nd)^(O)(1)logfrac1epsilon) by Parrilo and Sturmfels and Xue and Ye. In this paper we show how to compute a (1+epsilon)-approximate geometric median in time O(ndlog^(3)frac1epsilon) and O(depsilon^(-2)). While our O(depsilon^(-2)) is a fairly straightforward application of stochastic subgradient descent, our O(ndlog^(3)frac1epsilon) time algorithm is a novel long step interior point method. To achieve this running time we start with a simple O((nd)^(O)(1)logfrac1epsilon) time interior point method and show how to improve it, ultimately building an algorithm that is quite non-standard from the perspective of interior point literature. Our result is one of very few cases we are aware of outperforming traditional interior point theory and the only we are aware of using interior point methods to obtain a nearly linear time algorithm for a canonical optimization problem that traditionally requires superlinear time. We hope our work leads to further improvements in this line of research.
