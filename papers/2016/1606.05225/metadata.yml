  - Yin Tat Lee
  - Gary Miller
  - Jakub Pachocki
  - Aaron Sidford
year: 2016
source: Proceedings of the forty-eighth annual ACM symposium on Theory of Computing
type: Conference Paper
doi: 10.1145/2897518.2897647
arxiv_id: "1606.05225"
tags:
  - Geometric median
