abstract: We show that gradient descent converges to a local minimizer, almost surely with random initialization. This is proved by applying the Stable Manifold Theorem from dynamical systems theory.
summary: This paper shows that gradient descent converges to a local minimizer, almost surely with random initialization. The abstract also notes that this is proved by applying the Stable Manifold Theorem from dynamical systems theory.
