  - Tobias Sutter
  - John Lygeros
year: 2013
source: IEEE Transactions on Automatic Control
type: Journal Paper
doi: 10.1109/TAC.2014.2330702
arxiv_id: "1307.0345"
tags:
  - Scenario optimization
