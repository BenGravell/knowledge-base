title: >
  Analysis and Design of Optimization Algorithms via Integral Quadratic Constraints
algorithm: IQC
authors:
  - Laurent Lessard
  - Benjamin Recht
  - Andrew Packard
year: 2014
source: SIAM Journal on Optimization
type: Journal Paper
doi: 10.1137/15m1009597
arxiv_id: "1408.3595"
tags:
  - Semidefinite programming
