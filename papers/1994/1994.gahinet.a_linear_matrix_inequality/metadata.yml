title: >
  A Linear Matrix Inequality Approach to H∞ Control
algorithm: LMI H-infinity Control
authors:
  - Pascal Gahinet
  - Pierre Apkarian
year: 1994
source: International Journal of Robust and Nonlinear Control
type: Journal Paper
doi: 10.1002/rnc.4590040403
arxiv_id:
tags:
  - H-infinity control
