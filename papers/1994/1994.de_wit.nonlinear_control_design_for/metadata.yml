abstract: >
  Much research in the field of mobile robots has been carried out in mechanical design, posture detection methods, vision, path planning, control design, etc. Higher levels of task specifications rely on the tracking and regulation capabilities of the feedback control design. This chapter provides an overview of nonlinear control design for mobile robots. Structural properties, such as controllability, feedback linearizability and feedback stabilizability of the system under consideration, are discussed. Control strategies designed to stabilize the motion of mobile robots about either a time-indexed trajectory, a geometric path, or a fixed point in the configuration-space of the robot are presented and compared via theoretical discussions and simulations.
summary: >
  This chapter collects nonlinear control designs for wheeled mobile robots, with emphasis on the kinematic constraints and tracking or stabilization behavior that make nonholonomic vehicles different from fully actuated systems. It is a useful historical reference for the control laws and modeling assumptions that recur in later mobile-robot tracking literature.
