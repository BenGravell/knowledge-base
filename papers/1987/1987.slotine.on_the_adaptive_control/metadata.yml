title: >
  On the Adaptive Control of Robot Manipulators
algorithm: Slotine-Li Adaptive Robot Control
authors:
  - Jean-Jacques E. Slotine
  - Weiping Li
year: 1987
source: The International Journal of Robotics Research
type: Journal Paper
