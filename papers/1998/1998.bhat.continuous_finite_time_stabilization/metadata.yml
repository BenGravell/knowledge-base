title: >
  Continuous Finite-time Stabilization of the Translational and Rotational Double Integrators
algorithm: Finite-Time Double-Integrator Stabilization
authors:
  - S.P. Bhat
  - D.S. Bernstein
year: 1998
source: IEEE Transactions on Automatic Control
type: Journal Paper
