abstract: >
  This paper presents the control of an underactuated two-link robot called the Pendubot. We propose a controller for swinging the linkage and raise it to its uppermost unstable equilibrium position. The balancing control is based on an energy approach and the passivity properties of the system.
summary: >
  Designs an energy-based controller for swinging the underactuated Pendubot to its unstable upright equilibrium, paired with a balancing controller based on passivity properties. The paper is a standard reference for underactuated two-link robot swing-up using physical energy shaping rather than trajectory tracking alone.
