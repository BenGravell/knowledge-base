title: >
  SCTOMP: Spatially Constrained Time-Optimal Motion Planning
algorithm: SCTOMP
authors:
  - Jon Arrizabalaga
  - Markus Ryll
year: 2022
source: IEEE/RSJ International Conference on Intelligent Robots and Systems
type: Conference Paper
doi: 10.1109/IROS55552.2023.10341500
arxiv_id: "2210.02345"
tags:
