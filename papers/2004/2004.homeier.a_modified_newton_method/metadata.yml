title: >
  A Modified Newton Method with Cubic Convergence: The Multivariate Case
algorithm: "Midpoint Newton Method, cubic convergence analysis"
authors:
  - H.H.H Homeier
year: 2004
source: Journal of Computational and Applied Mathematics
type: Journal Paper
doi: 10.1016/j.cam.2003.12.041
