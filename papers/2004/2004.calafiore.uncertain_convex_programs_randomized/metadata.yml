title: >
  Uncertain Convex Programs: Randomized Solutions and Confidence Levels
algorithm: Scenario Approach
authors:
  - Giuseppe C. Calafiore
  - Marco C. Campi
year: 2004
source: Mathematical Programming
type: Journal Paper
doi: 10.1007/s10107-003-0499-y
arxiv_id:
tags:
