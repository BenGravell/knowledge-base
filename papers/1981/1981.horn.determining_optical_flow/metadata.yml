title: >
  Determining Optical Flow
algorithm: Horn-Schunck Optical Flow
authors:
  - Berthold K. P. Horn
  - Brian G. Schunck
year: 1981
source: Artificial Intelligence
type: Journal Paper
doi: 10.1016/0004-3702(81)90024-2
arxiv_id: ""
