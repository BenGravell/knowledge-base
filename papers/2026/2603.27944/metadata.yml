title: >
  Flip Stunts on Bicycle Robots Using Iterative Motion Imitation
algorithm: IMI
authors:
  - Jeonghwan Kim
  - Shamel Fahmi
  - Seungeun Rho
  - Sehoon Ha
  - Gabriel Nelson
year: 2026
source: IEEE International Conference on Robotics and Automation (ICRA)
type: Conference Paper
