title: >
  Trajectory Generation and Control for Precise Aggressive Maneuvers with Quadrotors
algorithm: Aggressive Maneuver Control
authors:
  - Daniel Mellinger
  - Nathan Michael
  - Vijay Kumar
year: 2012
source: The International Journal of Robotics Research
type: Journal Paper
