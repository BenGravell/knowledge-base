title: >
  Generation of Collision-Free Trajectories for a Quadrocopter Fleet: A Sequential Convex Programming Approach
algorithm: Sequential Convex Programming
authors:
  - Federico Augugliaro
  - Angela P. Schoellig
  - Raffaello D'Andrea
year: 2012
source: IEEE/RSJ International Conference on Intelligent Robots and Systems
type: Conference Paper
