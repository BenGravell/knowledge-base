title: >
  Reference-Free Formula Drift with Reinforcement Learning: From Driving Data to Tire Energy-Inspired, Real-World Policies
algorithm:
authors:
  - Franck Djeumou
  - Michael Thompson
  - Makoto Suminaka
  - John Subosits
year: 2024
source:
type: Preprint
