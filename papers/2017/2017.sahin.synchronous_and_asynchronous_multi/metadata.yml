title: >
  Synchronous and Asynchronous Multi-Agent Coordination with cLTL+ Constraints
algorithm: cLTL+
authors:
  - Yunus Emre Sahin
  - Petter Nilsson
  - Necmiye Ozay
year: 2017
source: IEEE Conference on Decision and Control (CDC)
type: Conference Paper
doi: 10.1109/CDC.2017.8263687
arxiv_id:
tags:
  - Multi-agent systems
  - Temporal logic
  - Motion planning
  - Optimization-based synthesis
  - Asynchronous coordination
