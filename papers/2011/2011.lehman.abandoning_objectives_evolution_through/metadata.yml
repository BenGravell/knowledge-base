title: >
  Abandoning Objectives: Evolution through the Search for Novelty Alone
algorithm: Novelty Search
authors:
  - Joel Lehman
  - Kenneth O. Stanley
year: 2011
source: Evolutionary Computation
type: Journal Paper
doi: 10.1162/EVCO_a_00025
