title: >
  HOGWILD! : A Lock-Free Approach to Parallelizing Stochastic Gradient Descent
algorithm: HOGWILD!
authors:
  - Feng Niu
  - Benjamin Recht
  - Christopher Re
  - Stephen J. Wright
year: 2011
source: Advances in Neural Information Processing Systems
type: Conference Paper
doi:
arxiv_id: "1106.5730"
tags:
