title: >
  Controllability of Complex Networks
algorithm: Structural Controllability via Maximum Matching
authors:
  - Yang-Yu Liu
  - Jean-Jacques Slotine
  - Albert-Laszlo Barabasi
year: 2011
source: Nature
type: Journal Paper
doi: 10.1038/nature10011
arxiv_id:
tags:
