title: >
  Collision-Free and Curvature-Continuous Path Smoothing in Cluttered Environments
algorithm: Curvature-Continuous B-Spline Path Smoothing
authors:
  - Jia Pan
  - Liangjun Zhang
  - Dinesh Manocha
year: 2011
source: 'Robotics: Science and Systems'
type: Conference Paper
