title: >
  Robot Learning from Demonstration by Constructing Skill Trees
algorithm: CST
authors:
  - George Konidaris
  - Scott Kuindersma
  - Roderic Grupen
  - Andrew Barto
year: 2011
source: The International Journal of Robotics Research
type: Journal Paper
