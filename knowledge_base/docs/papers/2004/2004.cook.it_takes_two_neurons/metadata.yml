title: >
  It Takes Two Neurons to Ride a Bicycle
algorithm: Two-neuron bicycle controller
authors:
- Matthew Cook
year: 2004
source: California Institute of Technology
type: Technical Report
doi: null
arxiv_id: null
tags:
- Bicycle control
