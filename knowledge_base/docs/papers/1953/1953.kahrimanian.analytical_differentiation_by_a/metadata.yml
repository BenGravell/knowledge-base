summary: >
  Kahrimanian's master's thesis describes an early system for representing formulas and deriving their analytical derivatives on a digital computer. It is a seminal pre-computer-algebra-system contribution because it treats differentiation as a symbolic transformation over machine-manipulable expressions rather than as hand algebra or finite differencing.
