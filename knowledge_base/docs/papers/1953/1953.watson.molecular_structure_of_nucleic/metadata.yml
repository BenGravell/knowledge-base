abstract: >
  We wish to suggest a structure for the salt of deoxyribose nucleic acid (D.N.A.). This structure has novel features which are of considerable biological interest.
summary: >
  Watson and Crick propose the double-helical structure of DNA, with paired bases on the inside of the molecule and sugar-phosphate backbones on the outside. The paper is historically decisive because the proposed complementary pairing immediately made heredity and replication mechanistically plausible, even though the short article leaves much of the experimental evidence to companion work.
