title: >
  Values and Strategies for Infinite Time Linear Quadratic Games
algorithm: Infinite-Horizon LQ Game Riccati Solution
authors:
  - Eleftherios F. Mageirou
year: 1976
source: IEEE Transactions on Automatic Control
type: Journal Paper
