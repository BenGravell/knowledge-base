summary: >
  Huffman gives the constructive greedy algorithm for building minimum-redundancy prefix codes from symbol probabilities. The method became the standard practical entropy coding tool behind many lossless compressors and image formats, and it also supplies an important baseline against which arithmetic coding and later context-adaptive coders are compared.
