title: >
  An Approximation of the Error Backpropagation Algorithm in a Predictive Coding Network with Local Hebbian Synaptic Plasticity
algorithm: Predictive coding with Hebbian plasticity
authors:
- James C. R. Whittington
- Rafal Bogacz
year: 2017
source: Neural Computation
type: Journal Paper
doi: 10.1162/NECO_a_00949
arxiv_id: null
tags:
- Predictive coding
- Backpropagation
- Hebbian learning
- Cortical networks
- Supervised learning
abstract: >
  To efficiently learn from feedback, cortical networks need to update synaptic weights on multiple levels of cortical hierarchy. An effective and well-known algorithm for computing such changes in synaptic weights is the error backpropagation algorithm. However, in this algorithm, the change in synaptic weights is a complex function of weights and activities of neurons not directly connected with the synapse being modified, whereas the changes in biological synapses are determined only by the activity of presynaptic and postsynaptic neurons. Several models have been proposed that approximate the backpropagation algorithm with local synaptic plasticity, but these models require complex external control over the network or relatively complex plasticity rules. Here we show that a network developed in the predictive coding framework can efficiently perform supervised learning fully autonomously, employing only simple local Hebbian plasticity. Furthermore, for certain parameters, the weight change in the predictive coding model converges to that of the backpropagation algorithm. This suggests that it is possible for cortical networks with simple Hebbian synaptic plasticity to implement efficient learning algorithms in which synapses in areas on multiple levels of hierarchy are modified to minimize the error on the output.
summary: >
  Shows that a predictive coding network can perform supervised learning with local Hebbian plasticity and approach backpropagation weight updates under suitable conditions.
