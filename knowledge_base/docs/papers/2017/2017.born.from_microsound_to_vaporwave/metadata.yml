title: >
  From Microsound to Vaporwave: Internet-Mediated Musics, Online Methods, and Genre
algorithm:
authors:
  - Georgina Born
  - Christopher Haworth
year: 2017
source: Music and Letters
type: Journal Paper
doi: 10.1093/ml/gcx095
arxiv_id:
