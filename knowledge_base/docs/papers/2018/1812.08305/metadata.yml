title: >
  Derivative-Free Methods for Policy Optimization: Guarantees for Linear Quadratic Systems
algorithm: Derivative-Free Methods for Policy Optimization
authors:
  - Dhruv Malik
  - Ashwin Pananjady
  - Kush Bhatia
  - Koulik Khamaru
  - Peter L. Bartlett
  - Martin J. Wainwright
year: 2018
source: International Conference on Artificial Intelligence and Statistics
type: Conference Paper
doi:
arxiv_id: "1812.08305"
tags:
  - Optimization
  - Derivative-free
