  - APDAGD
abstract: >
  We analyze two algorithms for approximating the general optimal transport (OT) distance between two discrete distributions of size n, up to accuracy epsilon. For the first algorithm, which is based on the celebrated Sinkhorn's algorithm, we prove the complexity bound O~(n^(2)/epsilon^(2)) arithmetic operations. For the second one, which is based on our novel Adaptive Primal-Dual Accelerated Gradient Descent (APDAGD) algorithm, we prove the complexity bound O~(min{n^(9/4)/epsilon, n^(2)/epsilon^(2) }) arithmetic operations. Both bounds have better dependence on epsilon than the state-of-the-art result given by O~(n^(2)/epsilon^(3)). Our second algorithm not only has better dependence on epsilon in the complexity bound, but also is not specific to entropic regularization and can solve the OT problem with different regularizers.
