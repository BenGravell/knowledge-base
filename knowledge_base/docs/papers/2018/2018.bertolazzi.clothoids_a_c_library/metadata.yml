abstract: >
  A C++ library with Matlab interface for the computation of clothoid curves and related algorithms, such as interpolation problems, is herein presented. Clothoids are planar curves parametrised by arclength that exhibit linear curvature. Therefore, they are useful in a variety of applications, as they naturally model many phenomena in various fields of science. However, their transcendental nature and oscillatory behaviour (because of the Fresnel integrals) render their computation a difficult task. The present library offers a numerically accurate and efficient answer to important problems of interpolation, intersection and manipulation of these curves. It is freely available at Matlab Central.
summary: >
  Presents an efficient C++ library and Matlab interface for constructing and manipulating clothoid curves. Supports G1 and G2 Hermite interpolation, distance queries, intersections, and clothoid splines while handling the numerical challenges of Fresnel integrals.
