title: >
  Non-asymptotic Identification of LTI Systems from a Single Trajectory
algorithm: Ho-Kalman Identification
authors:
  - Samet Oymak
  - Necmiye Ozay
year: 2018
source: American Control Conference (ACC)
type: Conference Paper
