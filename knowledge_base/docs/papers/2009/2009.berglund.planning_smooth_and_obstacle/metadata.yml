title: >
  Planning Smooth and Obstacle-Avoiding B-Spline Paths for Autonomous Mining Vehicles
algorithm: Minimum Curvature Variation B-Splines
authors:
- Tomas Berglund
- Andrej Brodnik
- Hakan Jonsson
- Mats Staffanson
- Inge Soderkvist
year: 2009
source: IEEE Transactions on Automation Science and Engineering
type: Journal Paper
doi: 10.1109/TASE.2009.2015886
arxiv_id: null
tags:
- Path planning
- B-splines
- Curvature variation
- Obstacle avoidance
- Mining vehicles
abstract: >
  In this paper we study the problem of computing smooth planar paths in the presence of obstacles where we have an a priori knowledge about the environment. We investigate how the smoothness of a path and the total travel time required by the path are related for paths used by a four-wheel four-gear articulated vehicle. A path is considered smooth if the variation of its curvature, i.e., the integral of the square of the derivative of curvature along the path, is minimal. Paths are defined by quartic B-splines and obstacles are represented by polygonal chains. Quartic B-splines have a continuous derivative of curvature. Obstacle-avoidance is achieved by means of the envelope of the B-splines. We present a study of eight cases based on real-world application data from the Swedish mining company Luossavaara-Kiirunavaara AB (LKAB). The results indicate that a minimum curvature variation B-spline path-planning algorithm we have developed yields paths that are substantially better than the ones used by LKAB today. Our simulations shows that the new paths are up to 39% faster to travel along than the paths currently in use. They even decrease the wear on the vehicle. Preliminary results from the production at LKAB show an overall 5-10% decrease in the total time. The total time includes both travel on the path and ore loading and unloading.
summary: >
  Plans obstacle-avoiding quartic B-spline paths by minimizing curvature variation and enforcing safety margins. Mining-vehicle case studies relate geometric smoothness to faster travel and reduced vehicle wear.
