title: >
  The Robust Estimation of Multiple Motions: Parametric and Piecewise-Smooth Flow Fields
algorithm: Black-Anandan Robust Optical Flow
authors:
  - Michael J. Black
  - P. Anandan
year: 1996
source: Computer Vision and Image Understanding
type: Journal Paper
doi: 10.1006/cviu.1996.0006
arxiv_id: ""
tags:
  - Optical flow
  - Robust estimation
  - Multiple motion
