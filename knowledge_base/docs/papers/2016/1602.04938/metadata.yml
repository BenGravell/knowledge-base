  - Sameer Singh
  - Carlos Guestrin
year: 2016
source: 'Proceedings of the Conference of the North American Chapter of the Association for Computational Linguistics: Demonstrations'
type: Conference Paper
doi: 10.18653/v1/n16-3020
arxiv_id: "1602.04938"
