title: >
  Accelerating the Super-Resolution Convolutional Neural Network
algorithm: FSRCNN
authors:
  - Chao Dong
  - Chen Change Loy
  - Xiaoou Tang
year: 2016
source: European Conference on Computer Vision (ECCV)
type: Conference Paper
doi: 10.1007/978-3-319-46475-6_25
arxiv_id: "1608.00367"
tags:
  - Image super-resolution
