title: >
  Constrained Path Optimization with Bézier Curve Primitives
algorithm: Bézier motion primitives
authors:
- Ji-Wung Choi
- Kalevi Huhtala
year: 2014
source: IEEE/RSJ International Conference on Intelligent Robots and Systems
type: Conference Paper
doi: 10.1109/IROS.2014.6942568
arxiv_id: null
tags:
- Motion primitives
