title: >
  Entropic Portfolio Optimization: A Disciplined Convex Programming Framework
algorithm: EVaR/EDaR
authors:
- Dany Cajas
year: 2021
source: SSRN
type: Preprint
doi: 10.2139/ssrn.3792520
arxiv_id: null
tags:
- Portfolio optimization
