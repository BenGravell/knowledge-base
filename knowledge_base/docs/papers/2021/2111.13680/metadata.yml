  - Dacheng Tao
year: 2021
source: IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)
type: Conference Paper
doi: 10.1109/CVPR52688.2022.00795
arxiv_id: "2111.13680"
tags:
  - Optical flow
