abstract: Dynamical systems are topologically equivalent when their orbits can be mapped onto each other via a homeomorphic change of coordinates. We will show that in general, closed-loop systems resulting from Linear Quadratic Optimal Control problems are all topologically equivalent. As such, we provide new insights in structural "tuning" of controlled behaviour.
