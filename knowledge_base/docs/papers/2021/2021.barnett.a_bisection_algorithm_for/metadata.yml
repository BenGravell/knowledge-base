title: >
  A Bisection Algorithm for Time-Optimal Trajectory Planning Along Fully Specified Paths
algorithm:
authors:
  - Eric Barnett
  - Clement Gosselin
year: 2021
source: IEEE Transactions on Robotics
type: Journal Paper
