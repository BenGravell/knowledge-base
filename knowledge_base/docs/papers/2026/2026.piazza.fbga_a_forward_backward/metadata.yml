abstract: >
  We present FBGA, a new algorithm for time-optimal velocity planning under generic acceleration constraints. By extending previous forward-backward approaches to handle custom acceleration constraints, our FBGA matches the accuracy of optimal control baselines while being up to three orders of magnitude faster. Our open-source C++ implementation is available at: https://github.com/DRIVEWISE/FBGA.
summary: >
  Extends forward-backward velocity planning to generic, speed-dependent acceleration envelopes such as g-g-v diagrams. FBGA closely matches optimal-control lap times while reducing full-lap computation to milliseconds, making high-fidelity speed planning practical inside online sampling-based planners.
