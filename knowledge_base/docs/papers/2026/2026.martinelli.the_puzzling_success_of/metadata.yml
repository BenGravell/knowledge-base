title: >
  The Puzzling Success of Overparameterization: Lottery Tickets or Escape Dimensions?
algorithm: Escape Dimensions Theory
authors:
- Flavio Martinelli
- Johanni Brea
- Wulfram Gerstner
year: 2026
source: EPFL Infoscience
type: Preprint
