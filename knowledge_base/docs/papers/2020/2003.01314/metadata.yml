title: >
  EGAD! An Evolved Grasping Analysis Dataset for Diversity and Reproducibility in Robotic Manipulation
algorithm: EGAD
authors:
  - Douglas Morrison
  - Peter Corke
  - Jurgen Leitner
year: 2020
source: IEEE Robotics and Automation Letters
type: Journal Paper
doi: 10.1109/lra.2020.2992195
arxiv_id: "2003.01314"
tags:
  - Robotics
