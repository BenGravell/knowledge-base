title: >
  RAPTOR: Robust and Perception-aware Trajectory Replanning for Quadrotor Fast Flight
algorithm: RAPTOR
authors:
  - Boyu Zhou
  - Jie Pan
  - Fei Gao
  - Shaojie Shen
year: 2020
