title: >
  Interpretable Goal-Based Prediction and Planning for Autonomous Driving
algorithm: Goal-Based Prediction and Planning
authors:
  - Stefano V. Albrecht
  - Cillian Brewitt
  - John Wilhelm
  - Balint Gyevnar
  - Francisco Eiras
  - Mihai Dobre
  - Subramanian Ramamoorthy
year: 2020
source: IEEE International Conference on Robotics and Automation (ICRA)
type: Conference Paper
doi: 10.1109/ICRA48506.2021.9560849
arxiv_id: "2002.02277"
tags:
  - Autonomous driving
