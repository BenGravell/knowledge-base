title: >
  From Noisy Data to Feedback Controllers: Nonconservative Design via a Matrix S-Lemma
algorithm: "Matrix S-Lemma"
authors:
  - Henk J. van Waarde
  - M. Kanat Camlibel
  - Mehran Mesbahi
year: 2020
source: "IEEE Transactions on Automatic Control"
type: Journal Paper
doi: 10.1109/TAC.2020.3047577
arxiv_id: "2006.00870"
tags:
