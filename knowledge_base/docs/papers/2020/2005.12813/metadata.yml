title: >
  AlphaPilot: Autonomous Drone Racing
algorithm: AlphaPilot
authors:
- Philipp Foehn
- Dario Brescianini
- Elia Kaufmann
- Titus Cieslewski
- Mathias Gehrig
- Manasi Muglikar
- Davide Scaramuzza
year: 2020
source: 'Robotics: Science and Systems (RSS)'
type: Conference Paper
doi: 10.15607/RSS.2020.XVI.081
arxiv_id: "2005.12813"
tags:
- Autonomous drone racing
