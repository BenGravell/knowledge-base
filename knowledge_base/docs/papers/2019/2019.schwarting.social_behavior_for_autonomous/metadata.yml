title: >
  Social Behavior for Autonomous Vehicles
algorithm: SVO-based driving
authors:
- Wilko Schwarting
- Alyssa Pierson
- Javier Alonso-Mora
- Sertac Karaman
- Daniela Rus
year: 2019
source: Proceedings of the National Academy of Sciences
type: Journal Paper
doi: 10.1073/pnas.1820676116
arxiv_id: null
tags:
- Autonomous driving
