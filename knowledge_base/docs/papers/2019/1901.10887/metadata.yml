title: >
  COSMO: A Conic Operator Splitting Method for Convex Conic Problems
algorithm: COSMO
authors:
  - Michael Garstka
  - Mark Cannon
  - Paul Goulart
year: 2019
source: Journal of Optimization Theory and Applications
type: Journal Paper
doi: 10.1007/s10957-021-01896-x
arxiv_id: "1901.10887"
tags:
  - Conic optimization
