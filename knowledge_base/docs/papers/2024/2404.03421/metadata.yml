title: >
  Gen3DSR: Generalizable 3D Scene Reconstruction via Divide and Conquer from a Single View
algorithm: Gen3DSR
authors:
  - Andreea Ardelean
  - Mert Ozer
  - Bernhard Egger
year: 2024
