abstract: >
  The Linear Quadratic Regulator (LQR) and the H∞ control problems for linear systems are revisited with the objective of deriving a novel algebraic (polynomial) equation alternative to the standard Algebraic Riccati Equation (ARE). Differently from the latter, the former is envisioned to involve the policy alone, in place of the value function as in the ARE. The resulting equation, referred to as the Policy Algebraic Equation, contains nm variables and equations, of order less than or equal to 2n, where n and m denote the dimension of the state and the input, respectively.
