title: >
  A Universal Image Quality Index
algorithm: UQI
authors:
  - Zhou Wang
  - Alan C. Bovik
year: 2002
source: IEEE Signal Processing Letters
type: Journal Paper
doi: 10.1109/97.995823
arxiv_id: 
tags:
  - Image quality assessment
