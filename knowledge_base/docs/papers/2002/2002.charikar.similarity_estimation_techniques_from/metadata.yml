title: >
  Similarity Estimation Techniques from Rounding Algorithms
algorithm: SimHash
authors:
  - Moses S. Charikar
year: 2002
source: Proceedings of the thiry-fourth annual ACM symposium on Theory of computing
type: Conference Paper
doi: 10.1145/509907.509965
