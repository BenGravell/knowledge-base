title: >
  Trajectory Optimization for Domains with Contacts Using Inverse Dynamics
algorithm: Inverse-Dynamics Trajectory Optimization
authors:
  - Tom Erez
  - Emanuel Todorov
year: 2012
source: IEEE/RSJ International Conference on Intelligent Robots and Systems
type: Conference Paper
doi: 10.1109/IROS.2012.6386181
arxiv_id: 
tags:
  - Trajectory optimization
  - Contact dynamics
