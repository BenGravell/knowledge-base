title: >
  Acceleration by Stepsize Hedging I: Multi-Step Descent and the Silver Stepsize Schedule
algorithm: Acceleration by Stepsize Hedging I
authors:
  - Jason M. Altschuler
  - Pablo A. Parrilo
year: 2023
source: Journal of the ACM
type: Journal Paper
doi: 10.1145/3708502
arxiv_id: "2309.07879"
tags:
