title: >
  Monte Carlo Tree Search for Behavior Planning in Autonomous Driving
algorithm: MCTS Behavior Planner
authors:
  - Qianfeng Wen
  - Zhongyi Gong
  - Lifeng Zhou
  - Zhongshun Zhang
year: 2023
source: IEEE International Symposium on Safety, Security, and Rescue Robotics (SSRR)
type: Conference Paper
doi: 10.1109/SSRR62954.2024.10770028
arxiv_id: "2310.12075"
tags:
  - Autonomous driving
