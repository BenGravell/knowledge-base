title: >
  A Chiral Aperiodic Monotile
algorithm:
authors:
  - David Smith
  - Joseph Samuel Myers
  - Craig S. Kaplan
  - Chaim Goodman-Strauss
year: 2023
source: Combinatorial Theory
type: Journal Paper
