title: >
  Motion Perceiver: Real-Time Occupancy Forecasting for Embedded Systems
algorithm: MotionPerceiver
authors:
  - Bryce Ferenczi
  - Michael Burke
  - Tom Drummond
year: 2023
source: IEEE Robotics and Automation Letters
type: Journal Paper
doi: 10.1109/LRA.2024.3360811
arxiv_id: "2306.08879"
tags:
  - Occupancy forecasting
