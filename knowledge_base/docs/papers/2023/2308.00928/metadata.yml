title: >
  QUANT: A Minimalist Interval Method for Time Series Classification
algorithm: QUANT
authors:
  - Angus Dempster
  - Daniel F. Schmidt
  - Geoffrey I. Webb
year: 2023
source: Data Mining and Knowledge Discovery
