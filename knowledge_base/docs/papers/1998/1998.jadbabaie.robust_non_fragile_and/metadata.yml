title: >
  Robust, Non-fragile and Optimal Controller Design via Linear Matrix Inequalities
algorithm: Nonfragile LMI State Feedback
authors:
  - A. Jadbabaie
  - C.T. Abdallah
  - D. Famularo
  - P. Dorato
year: 1998
