abstract: >
  We present a new algorithm for simulating large-scale crowds at interactive rates based on the Principle of Least Effort. Our approach uses an optimization method to compute a biomechanically energy-efficient, collision-free trajectory that minimizes the amount of effort for each heterogeneous agent in a large crowd. Moreover, the algorithm can automatically generate many emergent phenomena such as lane formation, crowd compression, edge and wake effects ant others. We compare the results from our simulations to data collected from prior studies in pedestrian and crowd dynamics, and provide visual comparisons with real-world video.
summary: >
  Introduces an effort-minimizing pedestrian motion model that computes collision-free trajectories for heterogeneous crowds at interactive rates. The simulations reproduce crowd patterns and are compared with pedestrian data and video.
