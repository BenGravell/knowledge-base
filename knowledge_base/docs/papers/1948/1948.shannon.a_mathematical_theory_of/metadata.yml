summary: >
  Shannon establishes the mathematical foundations of information theory, formalizing information, entropy, source coding, channel capacity, and reliable communication over noisy channels. For compression, the paper supplies the language and limits that later entropy coders, image codecs, and rate-distortion systems build on.
