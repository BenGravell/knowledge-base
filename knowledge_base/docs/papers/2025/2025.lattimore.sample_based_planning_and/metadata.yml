abstract: >
  We give a short tutorial on sample-based planning and learning with function approximation for reinforcement learning. The focus is on explaining the standard setups and algorithm design principles. The core algorithmic ideas explained are approximate backwards induction, the (Bellman) eluder dimension and the optimism principle.
