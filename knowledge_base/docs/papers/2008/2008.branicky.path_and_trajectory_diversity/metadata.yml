title: >
  Path and Trajectory Diversity: Theory and Algorithms
algorithm: Path and Trajectory Diversity
authors:
- Michael S. Branicky
- Ross A. Knepper
- James J. Kuffner
year: 2008
source: IEEE International Conference on Robotics and Automation (ICRA)
type: Conference Paper
doi: 10.1109/ROBOT.2008.4543392
arxiv_id: null
tags:
- Path diversity
