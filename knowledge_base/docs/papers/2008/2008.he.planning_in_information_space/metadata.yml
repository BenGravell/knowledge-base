title: >
  Planning in Information Space for a Quadrotor Helicopter in a GPS-denied Environment
algorithm: "Belief-Space Quadrotor Planning"
authors:
  - "Ruijie He"
  - "Sam Prentice"
  - "Nicholas Roy"
year: 2008
source: "IEEE International Conference on Robotics and Automation"
type: "Conference Paper"
doi: "10.1109/ROBOT.2008.4543471"
arxiv_id:
tags:
  - Belief-space planning
