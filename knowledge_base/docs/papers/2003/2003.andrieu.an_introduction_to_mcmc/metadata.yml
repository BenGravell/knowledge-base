abstract: >
  This purpose of this introductory paper is threefold. First, it introduces the Monte Carlo method with emphasis on probabilistic machine learning. Second, it reviews the main building blocks of modern Markov chain Monte Carlo simulation, thereby providing and introduction to the remaining papers of this special issue. Lastly, it discusses new interesting research horizons.
summary: >
  Provides an accessible introduction to Monte Carlo and modern Markov chain Monte Carlo methods for probabilistic machine learning. The tutorial frames the main MCMC building blocks and research directions that support Bayesian inference and sampling-based learning algorithms.
