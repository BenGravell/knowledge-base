title: >
  Deep Reinforcement Learning with Double Q-learning
algorithm: Double DQN
authors:
  - Hado van Hasselt
  - Arthur Guez
  - David Silver
year: 2015
source: Proceedings of the AAAI Conference on Artificial Intelligence
type: Journal Paper
doi: 10.1609/aaai.v30i1.10295
arxiv_id: "1509.06461"
tags:
  - Reinforcement learning
