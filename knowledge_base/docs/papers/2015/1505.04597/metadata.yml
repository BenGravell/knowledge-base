title: >
  U-Net: Convolutional Networks for Biomedical Image Segmentation
algorithm: U-Net
authors:
  - Olaf Ronneberger
  - Philipp Fischer
  - Thomas Brox
year: 2015
source: Lecture Notes in Computer Science
type: Other
