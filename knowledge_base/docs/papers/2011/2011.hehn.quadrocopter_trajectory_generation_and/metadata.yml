title: >
  Quadrocopter Trajectory Generation and Control
algorithm: Quadrocopter Trajectory Generation
authors:
  - Markus Hehn
  - Raffaello D'Andrea
year: 2011
source: IFAC Proceedings Volumes
type: Journal Paper
doi: 10.3182/20110828-6-it-1002.03178
arxiv_id:
tags:
