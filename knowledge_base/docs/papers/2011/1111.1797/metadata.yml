title: >
  Analysis of Thompson Sampling for the Multi-armed Bandit Problem
algorithm: Thompson Sampling
authors:
  - Shipra Agrawal
  - Navin Goyal
year: 2011
source: Conference on Learning Theory
type: Conference Paper
