title: >
  Online Least Squares Estimation with Self-Normalized Processes: An Application to Bandit Problems
algorithm: Self-Normalized Least Squares Confidence Sets
authors:
  - Yasin Abbasi-Yadkori
  - David Pal
  - Csaba Szepesvari
year: 2011
source: arXiv
type: Preprint
doi:
arxiv_id: "1102.2670"
tags:
  - Online least squares
  - Self-normalized processes
  - Linear bandits
  - Confidence sets
  - UCB algorithms
