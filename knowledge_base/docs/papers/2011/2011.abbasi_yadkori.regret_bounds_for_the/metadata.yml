title: >
  Regret Bounds for the Adaptive Control of Linear Quadratic Systems
algorithm: Optimistic Adaptive LQ Control
authors:
  - Yasin Abbasi-Yadkori
  - Csaba Szepesvari
year: 2011
source: Conference on Learning Theory
type: Conference Paper
