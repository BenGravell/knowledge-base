title: >
  A Flying Inverted Pendulum
algorithm: Flying Inverted Pendulum Control
authors:
  - Markus Hehn
  - Raffaello D'Andrea
year: 2011
source: IEEE International Conference on Robotics and Automation
type: Conference Paper
