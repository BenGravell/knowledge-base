title: >
  A Lyapunov-Like Characterization of Asymptotic Controllability
algorithm: Control Lyapunov Function
authors:
  - Eduardo D. Sontag
year: 1983
source: SIAM Journal on Control and Optimization
type: Journal Paper
doi: 10.1137/0321028
arxiv_id:
tags:
  - Control Lyapunov functions
  - Asymptotic controllability
  - Nonlinear control
  - Lyapunov methods
  - Stabilization
  - Feedback control
abstract: >
  It is shown that a control system in R^n is asymptotically controllable to the origin if and only if there exists a positive definite continuous functional of the states whose derivative can be made negative by appropriate choices of controls.
summary: >
  Sontag characterizes asymptotic controllability through the existence of a Lyapunov-like function whose derivative can be made negative by suitable controls. The result is a foundational step toward control Lyapunov functions and feedback stabilization theory for nonlinear systems.
