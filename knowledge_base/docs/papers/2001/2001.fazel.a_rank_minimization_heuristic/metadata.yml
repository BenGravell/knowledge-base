title: >
  A Rank Minimization Heuristic with Application to Minimum Order System Approximation
algorithm: Nuclear Norm Rank Heuristic
authors:
  - M. Fazel
  - H. Hindi
  - S.P. Boyd
year: 2001
source: Proceedings of the American Control Conference. (Cat. No.01CH37148)
type: Conference Paper
doi: 10.1109/ACC.2001.945730
arxiv_id:
tags:
  - Rank minimization
  - Nuclear norm
  - Semidefinite programming
  - Convex relaxation
  - System approximation
