title: >
  Minimizing Finite Sums with the Stochastic Average Gradient
algorithm: SAG
authors:
  - Mark Schmidt
  - Nicolas Le Roux
  - Francis Bach
year: 2013
source: Mathematical Programming
type: Journal Paper
doi: 10.1007/s10107-016-1030-6
arxiv_id: "1309.2388"
tags:
  - Stochastic average gradient
