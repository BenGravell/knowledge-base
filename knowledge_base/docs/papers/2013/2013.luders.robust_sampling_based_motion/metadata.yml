title: >
  Robust Sampling-Based Motion Planning with Asymptotic Optimality Guarantees
algorithm: CC-RRT*
authors:
- Brandon D. Luders
- Sertac Karaman
- Jonathan P. How
year: 2013
source: AIAA Guidance, Navigation, and Control Conference
type: Conference Paper
doi: 10.2514/6.2013-5097
arxiv_id: null
tags:
- Motion planning
