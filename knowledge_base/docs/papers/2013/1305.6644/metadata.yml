title: >
  Fast and Accurate G1 Fitting of Clothoid Curves
algorithm: G1 Clothoid Fitting
authors:
  - Enrico Bertolazzi
  - Marco Frego
year: 2013
source: Mathematical Methods in the Applied Sciences
type: Journal Paper
doi: 10.1002/mma.3114
arxiv_id: "1305.6644"
tags:
  - Clothoid curves
