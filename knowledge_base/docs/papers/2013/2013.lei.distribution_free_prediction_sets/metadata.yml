title: >
  Distribution-Free Prediction Sets
algorithm: Distribution-Free Prediction Sets
authors:
  - Jing Lei
  - James Robins
  - Larry Wasserman
year: 2013
source: Journal of the American Statistical Association
type: Journal Paper
doi: 10.1080/01621459.2012.751873
arxiv_id:
tags:
