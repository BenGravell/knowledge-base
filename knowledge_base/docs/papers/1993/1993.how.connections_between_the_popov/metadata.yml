abstract: The purpose of this paper is to investigate an extension of μ theory for robust control design by considering systems with linear and nonlinear real parameter uncertainties. In the process, explicit connections are made between mixed μ and absolute stability theory. In particular, it is shown that the upper bounds for mixed μ are a generalization of results from absolute stability theory. Both state space and frequency domain criteria are developed using the wealth of literature on absolute stability theory and the concepts of supply rates and storage functions. The state space conditions are expressed in terms of Riccati equations and parameter-dependent Lyapunov functions. A geometric interpretation of the equivalent frequency domain criteria in terms of off-axis circles clarifies the important role of the multiplier and shows that both the magnitude and phase of the uncertainty are considered.
