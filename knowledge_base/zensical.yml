site_name: Knowledge Base

site_url: https://bengravell.github.io/knowledge-base/

extra:
  generator: false
  nav_icons:
    home: lucide/home
    map: lucide/map
    tree: lucide/folder-tree
    timeline: lucide/history
    search: lucide/search
    analytics: lucide/chart-line
    about: lucide/info
    portfolio: lucide/briefcase

plugins:
  - macros:
      render_by_default: false

theme:
  name: zensical
  custom_dir: overrides
  logo: icon.png
  favicon: favicon.png

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: lucide/moon
        name: Switch to system preference

  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono

  features:
    - content.code.annotate
    - content.tabs.link
    - metadata
    - navigation.indexes
    - tags

extra_css:
  - stylesheets/extra.css
  - stylesheets/analytics.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/math-fit.js
  - javascripts/header-link.js
  - javascripts/nav-drawer-state.js
  - javascripts/site-link-data.js
  - javascripts/paper-link-pills.js

markdown_extensions:
  - meta
  - admonition
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.snippets
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Map: map.md
  - Tree: tree/index.md
  - Timeline: timeline.md
  - Search: search.md
  - Portfolio: https://bengravell.github.io/portfolio/
