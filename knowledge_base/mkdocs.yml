site_name: Knowledge Base

site_url: https://bengravell.github.io/knowledge-base/

extra:
  generator: false
  nav_icons:
    home: material/home
    map: material/map
    tree: material/file-tree-outline
    timeline: material/timeline-clock-outline
    search: material/magnify
    analytics: material/chart-line
    about: material/information-outline
    portfolio: material/briefcase-outline

not_in_nav: |
  papers/**/*.md

exclude_docs: |
  papers/**/embed_text.md
  papers/**/embed_input.md

plugins:
  - macros:
      render_by_default: false
      force_render_paths: |
        index.md
  - gen-files:
      scripts:
        - generate_papers.py
        - map/copy_assets.py
        - semantic_search/copy_assets.py
        - tree/generate_tree_data.py

theme:
  name: material
  custom_dir: overrides
  logo: icon.png
  favicon: favicon.png

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono

  features:
    - content.code.annotate
    - content.tabs.link
    - metadata
    - navigation.indexes
    - tags

extra_css:
  - stylesheets/extra.css
  - stylesheets/analytics.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/math-fit.js
  - javascripts/header-link.js
  - javascripts/nav-drawer-state.js
  - javascripts/site-link-data.js
  - javascripts/paper-link-pills.js

markdown_extensions:
  - meta
  - admonition
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.snippets
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Map: map.md
  - Tree: tree/index.md
  - Timeline: timeline.md
  - Search: search.md
  - Portfolio: https://bengravell.github.io/portfolio/
