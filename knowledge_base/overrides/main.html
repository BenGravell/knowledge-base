{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script>
    (function () {
      try {
        if (window.matchMedia("(min-width: 76.25em)").matches) {
          var state = window.localStorage.getItem("kb-primary-nav-open");
          if (state === "open" || state === "closed") {
            document.documentElement.dataset.kbPrimaryNavState = state;
          }
        }
      } catch (error) {
        document.documentElement.dataset.kbPrimaryNavState = "closed";
      }
    })();
  </script>
{% endblock %}
